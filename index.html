<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevPulse React Catalog - Fundamentos do React | SENAI</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone para transpilação de JSX em tempo real no browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; }
    code, pre { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-white flex flex-col">
  
  <!-- CONTAINER RAIZ DA APLICAÇÃO REACT -->
  <div id="root" class="flex-1 flex flex-col"></div>

  <!-- SCRIPT REACT + JSX TRANSPILED BY BABEL -->
  <script type="text/babel">
    const { useState, useMemo } = React;

    // ==========================================
    // DADOS ESTRUTURADOS: CONCEITOS DO REACT (Aula 08)
    // ==========================================
    const CONCEITOS_REACT = [
      {
        id: 1,
        titulo: "JSX (JavaScript XML)",
        categoria: "Sintaxe & Estrutura",
        nivel: "Iniciante",
        descricao: "Extensão de sintaxe para JavaScript que permite escrever estruturas similares ao HTML dentro do código JS. As chaves {} possibilitam injetar qualquer expressão JavaScript válida.",
        exemplo: "const elemento = <h1 className=\"title\">Olá, {nome}!</h1>;",
        destaque: true,
        concluido: true,
        tags: ["Sintaxe", "Babel", "HTML-in-JS"]
      },
      {
        id: 2,
        titulo: "Componentização & Árvore",
        categoria: "Arquitetura",
        nivel: "Iniciante",
        descricao: "Funções JavaScript puras que retornam elementos React. Permitem encapsular lógica, estado e apresentação em blocos reutilizáveis, compondo uma hierarquia em árvore (App -> Filhos).",
        exemplo: "function Botao({ rotulo }) { return <button>{rotulo}</button>; }",
        destaque: true,
        concluido: true,
        tags: ["Reutilização", "Modularidade", "Funções"]
      },
      {
        id: 3,
        titulo: "Props (Properties)",
        categoria: "Comunicação",
        nivel: "Iniciante",
        descricao: "Mecanismo unidirecional de passagem de dados de um componente pai para um filho. As props são estritamente imutáveis (read-only) do ponto de vista do componente receptor.",
        exemplo: "<CardConceito titulo=\"Props\" nivel=\"Iniciante\" ativo={true} />",
        destaque: true,
        concluido: true,
        tags: ["Unidirecional", "Imutabilidade", "Comunicação"]
      },
      {
        id: 4,
        titulo: "Virtual DOM & Reconciliação",
        categoria: "Performance",
        nivel: "Intermediário",
        descricao: "Representação leve da árvore do DOM mantida em memória. Quando ocorre mudança de estado, o React compara a nova árvore com a anterior (Diffing) e aplica apenas as mutações estritamente necessárias no DOM real.",
        exemplo: "ReactDOM.createRoot(document.getElementById('root')).render(<App />);",
        destaque: true,
        concluido: true,
        tags: ["Diffing Algorithm", "Otimização", "Reconciliação"]
      },
      {
        id: 5,
        titulo: "Listas e Keys Estáveis",
        categoria: "Manipulação de Coleções",
        nivel: "Intermediário",
        descricao: "O método Array.prototype.map() transforma arrays de objetos em elementos JSX. A prop 'key' fornece uma identidade estável e única que permite ao algoritmo de reconciliação rastrear adições, remoções e reordenações.",
        exemplo: "{itens.map(item => <li key={item.id}>{item.nome}</li>)}",
        destaque: false,
        concluido: true,
        tags: ["map()", "Keys", "Coleções"]
      },
      {
        id: 6,
        titulo: "Renderização Condicional",
        categoria: "Controle de Fluxo",
        nivel: "Iniciante",
        descricao: "Técnica para renderizar diferentes blocos visuais com base em condições booleanas ou de dados, utilizando operadores ternários (condicao ? A : B), curto-circuito lógico (&&) ou instruções if/return.",
        exemplo: "{carregando ? <Spinner /> : <ListaResultados dados={itens} />}",
        destaque: false,
        concluido: true,
        tags: ["Ternário", "Curto-Circuito", "UI Adaptativa"]
      },
      {
        id: 7,
        titulo: "Fragmentos (<React.Fragment> / <>)",
        categoria: "Sintaxe & Estrutura",
        nivel: "Iniciante",
        descricao: "Permite agrupar múltiplos elementos filhos adjacentes sem adicionar um nó extra (como uma <div> redundante) à árvore real do DOM.",
        exemplo: "return (<><h1>Título</h1><p>Parágrafo</p></>);",
        destaque: false,
        concluido: false,
        tags: ["Limpeza de DOM", "Fragment", "Sintaxe"]
      },
      {
        id: 8,
        titulo: "Regras de Ouro do JSX",
        categoria: "Boas Práticas",
        nivel: "Iniciante",
        descricao: "Convenções mandatórias do React: tags sem conteúdo devem ser autofechadas (<img />), atributos HTML devem adotar camelCase (ex: className, tabIndex) e todo componente deve retornar uma raiz única.",
        exemplo: "<label htmlFor=\"email\">E-mail</label><input id=\"email\" />",
        destaque: false,
        concluido: false,
        tags: ["Convenções", "camelCase", "Acessibilidade"]
      }
    ];

    // ==========================================
    // 1. COMPONENTE: CABECALHO (Demonstra Props & JSX)
    // ==========================================
    function Cabecalho({ titulo, subtitulo, totalConceitos, concluidos }) {
      const percentual = totalConceitos > 0 ? Math.round((concluidos / totalConceitos) * 100) : 0;

      return (
        <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-lg backdrop-blur-md bg-slate-900/90">
          <div className="max-w-6xl mx-auto px-4 py-4 sm:px-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 flex items-center justify-center font-bold text-lg shadow-sm">
                ⚛
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-extrabold text-white tracking-tight">{titulo}</h1>
                  <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                    React 18
                  </span>
                </div>
                <p className="text-xs text-slate-400">{subtitulo}</p>
              </div>
            </div>

            <div className="flex items-center gap-4 bg-slate-950/60 px-4 py-2 rounded-xl border border-slate-800">
              <div className="text-right">
                <div className="text-xs text-slate-400">Progresso de Aprendizado</div>
                <div className="text-sm font-bold text-slate-100">
                  {concluidos} de {totalConceitos} conceitos ({percentual}%)
                </div>
              </div>
              <div className="w-16 bg-slate-800 rounded-full h-2 overflow-hidden">
                <div 
                  className="bg-cyan-400 h-2 rounded-full transition-all duration-300" 
                  style={{ width: `${percentual}%` }}
                ></div>
              </div>
            </div>

          </div>
        </header>
      );
    }

    // ==========================================
    // 2. COMPONENTE: BARRA DE PESQUISA (Props callbacks)
    // ==========================================
    function BarraDePesquisa({ 
      termoBusca, 
      aoMudarBusca, 
      categoriaSelecionada, 
      aoMudarCategoria, 
      categorias,
      apenasConcluidos,
      aoAlternarConcluidos,
      aoLimparFiltros
    }) {
      return (
        <section className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 className="text-base font-bold text-white tracking-tight flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
                Filtros & Navegação no Catálogo
              </h2>
              <p className="text-xs text-slate-400">Pesquise por conceitos, palavras-chave ou filtre por área de conhecimento</p>
            </div>
            
            {(termoBusca || categoriaSelecionada !== 'ALL' || apenasConcluidos) && (
              <button 
                onClick={aoLimparFiltros}
                className="text-xs font-semibold text-rose-400 hover:text-rose-300 self-start sm:self-auto transition-colors"
              >
                ✕ Limpar Filtros
              </button>
            )}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-12 gap-3">
            <div className="sm:col-span-6">
              <input
                type="text"
                value={termoBusca}
                onChange={(e) => aoMudarBusca(e.target.value)}
                placeholder="Buscar por JSX, Props, Virtual DOM..."
                className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
              />
            </div>

            <div className="sm:col-span-3">
              <select
                value={categoriaSelecionada}
                onChange={(e) => aoMudarCategoria(e.target.value)}
                className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all"
              >
                <option value="ALL">Todas as Categorias</option>
                {categorias.map((cat) => (
                  <option key={cat} value={cat}>{cat}</option>
                ))}
              </select>
            </div>

            <div className="sm:col-span-3 flex items-center bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2">
              <label className="flex items-center gap-2 text-xs font-medium text-slate-300 cursor-pointer select-none">
                <input
                  type="checkbox"
                  checked={apenasConcluidos}
                  onChange={(e) => aoAlternarConcluidos(e.target.checked)}
                  className="w-4 h-4 rounded text-cyan-500 focus:ring-cyan-500 bg-slate-900 border-slate-700 cursor-pointer"
                />
                <span>Apenas Dominados</span>
              </label>
            </div>
          </div>
        </section>
      );
    }

    // ==========================================
    // 3. COMPONENTE: CARD CONCEITO (Renderização Condicional & Keys)
    // ==========================================
    function CardConceito({
      id,
      titulo,
      categoria,
      nivel,
      descricao,
      exemplo,
      destaque,
      concluido,
      tags,
      aoAlternarStatus
    }) {
      return (
        <article className={`bg-slate-900 border rounded-2xl p-5 transition-all duration-200 shadow-lg flex flex-col justify-between ${
          destaque ? 'border-cyan-500/50 shadow-cyan-500/10' : 'border-slate-800 hover:border-slate-700'
        }`}>
          <div className="space-y-3">
            <div className="flex items-start justify-between gap-2">
              <span className="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700">
                {categoria}
              </span>
              
              <div className="flex items-center gap-1.5">
                {destaque && (
                  <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-cyan-500/15 text-cyan-400 border border-cyan-500/30">
                    ★ Essencial
                  </span>
                )}
                
                <span className={`text-[11px] font-semibold px-2 py-0.5 rounded-full ${
                  nivel === 'Iniciante' 
                    ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                    : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                }`}>
                  {nivel}
                </span>
              </div>
            </div>

            <div>
              <h3 className="text-lg font-bold text-white tracking-tight">{titulo}</h3>
              <p className="mt-1 text-xs text-slate-300 leading-relaxed">{descricao}</p>
            </div>

            {exemplo && (
              <div className="bg-slate-950/80 rounded-xl p-3 border border-slate-800/80">
                <span className="text-[10px] font-mono uppercase tracking-wider text-slate-500 block mb-1">
                  Exemplo JSX:
                </span>
                <code className="text-xs font-mono text-cyan-300 block overflow-x-auto whitespace-pre">
                  {exemplo}
                </code>
              </div>
            )}
          </div>

          <div className="mt-4 pt-3 border-t border-slate-800/80 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div className="flex items-center gap-1.5 flex-wrap">
              {tags.map((tag) => (
                <span key={tag} className="text-[10px] font-mono text-slate-400 bg-slate-800/60 px-2 py-0.5 rounded">
                  #{tag}
                </span>
              ))}
            </div>

            <button
              onClick={() => aoAlternarStatus(id)}
              className={`text-xs font-semibold px-3 py-1.5 rounded-lg border transition-all flex items-center gap-1.5 self-start sm:self-auto ${
                concluido
                  ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30 hover:bg-emerald-500/20'
                  : 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700'
              }`}
            >
              <span>{concluido ? '✓ Dominado' : '○ Em Estudo'}</span>
            </button>
          </div>
        </article>
      );
    }

    // ==========================================
    // 4. COMPONENTE: LISTA DE CONCEITOS (map & keys)
    // ==========================================
    function ListaDeConceitos({ conceitos, aoAlternarStatus }) {
      if (conceitos.length === 0) {
        return (
          <div className="bg-slate-900 border border-slate-800 rounded-3xl p-12 text-center shadow-xl space-y-4">
            <div className="w-16 h-16 rounded-full bg-slate-800 text-slate-500 mx-auto flex items-center justify-center text-2xl font-bold">
              ∅
            </div>
            <div>
              <h3 className="text-lg font-bold text-white">Nenhum conceito encontrado</h3>
              <p className="text-sm text-slate-400 mt-1 max-w-md mx-auto">
                Nenhum resultado corresponde aos critérios de pesquisa ou filtros selecionados. Tente ajustar os termos de busca ou limpar os filtros.
              </p>
            </div>
          </div>
        );
      }

      return (
        <section className="space-y-4">
          <div className="flex items-center justify-between text-xs text-slate-400 px-1">
            <span>Exibindo <strong>{conceitos.length}</strong> {conceitos.length === 1 ? 'conceito' : 'conceitos'}</span>
            <span className="font-mono text-cyan-400">Virtual DOM Diffing Ativo</span>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {conceitos.map((conceito) => (
              <CardConceito
                key={conceito.id}
                id={conceito.id}
                titulo={conceito.titulo}
                categoria={conceito.categoria}
                nivel={conceito.nivel}
                descricao={conceito.descricao}
                exemplo={conceito.exemplo}
                destaque={conceito.destaque}
                concluido={conceito.concluido}
                tags={conceito.tags}
                aoAlternarStatus={aoAlternarStatus}
              />
            ))}
          </div>
        </section>
      );
    }

    // ==========================================
    // 5. COMPONENTE: RODAPÉ
    // ==========================================
    function Rodape({ ano, autor, instituicao, docente }) {
      return (
        <footer className="mt-12 border-t border-slate-800 bg-slate-950 py-8 px-4 text-center text-xs text-slate-500">
          <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <p className="font-semibold text-slate-400">{instituicao} • Especialização Front-End ({ano})</p>
              <p className="mt-0.5">Atividade 04: Fundamentos do React • Docente: <strong>{docente}</strong></p>
            </div>
            <div className="flex items-center gap-4 text-slate-400">
              <a 
                href="https://react.dev" 
                target="_blank" 
                rel="noreferrer"
                className="hover:text-cyan-400 transition-colors underline"
              >
                Documentação React Oficial
              </a>
              <span>•</span>
              <span className="font-mono text-cyan-400">Desenvolvido por {autor}</span>
            </div>
          </div>
        </footer>
      );
    }

    // ==========================================
    // 6. COMPONENTE RAIZ: APP
    // ==========================================
    function App() {
      const [conceitos, setConceitos] = useState(CONCEITOS_REACT);
      const [termoBusca, setTermoBusca] = useState('');
      const [categoriaSelecionada, setCategoriaSelecionada] = useState('ALL');
      const [apenasConcluidos, setApenasConcluidos] = useState(false);
      const [contadorReconciliacao, setContadorReconciliacao] = useState(0);

      const categorias = useMemo(() => {
        return Array.from(new Set(CONCEITOS_REACT.map(c => c.categoria)));
      }, []);

      const alternarStatusConceito = (id) => {
        setConceitos(prev => prev.map(c => {
          if (c.id === id) {
            return { ...c, concluido: !c.concluido };
          }
          return c;
        }));
        setContadorReconciliacao(prev => prev + 1);
      };

      const limparFiltros = () => {
        setTermoBusca('');
        setCategoriaSelecionada('ALL');
        setApenasConcluidos(false);
      };

      const conceitosFiltrados = useMemo(() => {
        return conceitos.filter(c => {
          const matchBusca = !termoBusca || 
            c.titulo.toLowerCase().includes(termoBusca.toLowerCase()) ||
            c.descricao.toLowerCase().includes(termoBusca.toLowerCase()) ||
            c.tags.some(t => t.toLowerCase().includes(termoBusca.toLowerCase()));

          const matchCategoria = categoriaSelecionada === 'ALL' || c.categoria === categoriaSelecionada;
          const matchConcluido = !apenasConcluidos || c.concluido;

          return matchBusca && matchCategoria && matchConcluido;
        });
      }, [conceitos, termoBusca, categoriaSelecionada, apenasConcluidos]);

      const totalConcluidos = useMemo(() => {
        return conceitos.filter(c => c.concluido).length;
      }, [conceitos]);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col antialiased selection:bg-cyan-500 selection:text-white">
          <Cabecalho
            titulo="DevPulse React Catalog"
            subtitulo="Explorador Interativo de Fundamentos do React • SENAI"
            totalConceitos={conceitos.length}
            concluidos={totalConcluidos}
          />

          <main className="max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 flex-1 space-y-8">
            <section className="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
              <div className="max-w-2xl">
                <span className="inline-block text-xs font-bold uppercase tracking-wider text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-3 py-1 rounded-full mb-3">
                  Árvore de Componentes & Virtual DOM
                </span>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                  Aprenda React com Componentes Reutilizáveis
                </h2>
                <p className="mt-2 text-sm text-slate-300 leading-relaxed">
                  Esta aplicação demonstra os 6 pilares exigidos na <strong>Aula 08</strong>: 
                  sintaxe <strong>JSX</strong>, decomposição em <strong>Componentes</strong>, fluxo de dados via <strong>Props</strong>, 
                  otimização com <strong>Virtual DOM</strong>, renderização de coleções com <strong>map() e keys</strong>, e <strong>Renderização Condicional</strong>.
                </p>
              </div>

              <div className="mt-6 pt-4 border-t border-slate-800 flex flex-wrap items-center gap-4 text-xs text-slate-400">
                <span>Reconciliações disparadas no estado: <strong className="text-cyan-400 font-mono">{contadorReconciliacao}</strong></span>
                <span>•</span>
                <span>Conceitos filtrados: <strong className="text-white font-mono">{conceitosFiltrados.length} / {conceitos.length}</strong></span>
              </div>
            </section>

            <BarraDePesquisa
              termoBusca={termoBusca}
              aoMudarBusca={setTermoBusca}
              categoriaSelecionada={categoriaSelecionada}
              aoMudarCategoria={setCategoriaSelecionada}
              categorias={categorias}
              apenasConcluidos={apenasConcluidos}
              aoAlternarConcluidos={setApenasConcluidos}
              aoLimparFiltros={limparFiltros}
            />

            <ListaDeConceitos
              conceitos={conceitosFiltrados}
              aoAlternarStatus={alternarStatusConceito}
            />
          </main>

          <Rodape
            ano={2026}
            autor="Letícia Vieira"
            instituicao="SENAI"
            docente="Prof. Me. Deivison S. Takatu"
          />
        </div>
      );
    }

    // Montagem no elemento #root usando React 18 createRoot
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
